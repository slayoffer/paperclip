# Fork-only credential regression checks. Do not include this workflow in an upstream patch.
name: Synthiq tool credential tests

on:
  pull_request:
    branches: ["synthiq/**"]
    paths:
      - .github/workflows/synthiq-tool-credentials.yml
      - server/src/services/tool-access.ts
      - server/src/services/tool-gateway.ts
      - server/src/services/connection-credentials.ts
      - server/src/services/connection-credential-bindings.ts
      - server/src/services/default-connection-grant.ts
      - server/src/services/tool-connection-health.ts
      - server/src/__tests__/tool-connection-reconnect-credentials.test.ts
      - packages/db/src/**
      - packages/shared/src/**
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: synthiq-tool-credentials-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tool-credentials:
    if: github.repository == 'slayoffer/paperclip'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Source: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # Source: https://github.com/actions/setup-node/releases/tag/v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Locate package store
        id: store
        run: |
          corepack enable
          echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Source: https://github.com/actions/cache/releases/tag/v4.2.4
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.store.outputs.path }}
          key: synthiq-tool-credentials-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
      - name: Install dependencies
        # Release metadata requires an update to the inherited lockfile.
        run: corepack pnpm install --no-frozen-lockfile
      - name: Build test dependencies
        run: |
          corepack pnpm --filter @paperclipai/paperclip-runner build:typescript
          corepack pnpm --filter @paperclipai/plugin-sdk build
      - name: Check shared types
        run: corepack pnpm --filter @paperclipai/shared typecheck
      - name: Check server types
        working-directory: server
        run: corepack pnpm exec tsc --noEmit
      - name: Test shared credential reconnect and gateway failures
        run: >-
          corepack pnpm exec vitest run --project @paperclipai/server
          server/src/__tests__/tool-connection-reconnect-credentials.test.ts
          --maxWorkers=1
