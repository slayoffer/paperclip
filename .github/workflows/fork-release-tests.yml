name: Fork release tests

on:
  pull_request:
    branches: ["synthiq/*"]
    types: [opened, synchronize, reopened, ready_for_review, labeled]

permissions:
  contents: read

concurrency:
  # Ignored label events must not cancel an active test run.
  group: fork-release-tests-${{ github.event.pull_request.number }}-${{ github.event.action == 'labeled' && github.event.label.name != 'fork-release-tests' && github.run_id || 'checks' }}
  cancel-in-progress: true

jobs:
  test-shards:
    name: Fork release tests (${{ matrix.shard }}/6)
    if: ${{ github.event.action != 'labeled' || github.event.label.name == 'fork-release-tests' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the pull request merge commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false

      - name: Check the workflow contract
        run: node --test .github/scripts/tests/fork-release-tests.test.mjs

      - name: Install pnpm
        run: npm install --global pnpm@9.15.4

      - name: Install repository dependencies
        id: install
        run: pnpm install --no-frozen-lockfile

      # Each check runs after a successful install, even if another check fails.
      # A failed step still fails the job. No step suppresses its exit status.
      - name: Check types
        id: typecheck
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 20
        run: pnpm -r typecheck

      # Separate runners isolate ports and files. Keep files serial within each shard.
      - name: Run the repository tests
        id: tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 150
        env:
          TEST_SHARD: ${{ matrix.shard }}/6
        run: |
          pnpm run preflight:workspace-links
          test_root="$(mktemp -d /tmp/pv-XXXXXX)"
          export NODE_ENV=test
          export PAPERCLIP_HOME="$test_root/h"
          export PAPERCLIP_CONFIG="$PAPERCLIP_HOME/config.json"
          export PAPERCLIP_INSTANCE_ID="vt-$GITHUB_RUN_ID-${TEST_SHARD%/*}"
          export TMPDIR="$test_root/t"
          mkdir -p "$PAPERCLIP_HOME" "$TMPDIR"
          # Codex's fs sandbox (bwrap) needs unprivileged user and network namespaces.
          # GitHub-hosted Ubuntu 24.04 runners deny them through AppArmor, so the real-runnerd
          # Codex test fails here on upstream v2026.1023.0 too. Skip it only on such a runner.
          if ! unshare --user --map-root-user --net true 2>/dev/null; then export PAPERCLIP_TEST_NO_USERNS_SANDBOX=1; fi
          pnpm exec vitest run --shard="$TEST_SHARD" --exclude '**/dist/**' --no-file-parallelism --maxWorkers=1 --pool=forks --isolate

      - name: Build the repository
        id: build
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 20
        run: pnpm build

      - name: Record the tested commits and results
        if: ${{ always() }}
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          INSTALL_RESULT: ${{ steps.install.outcome }}
          TYPECHECK_RESULT: ${{ steps.typecheck.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          BUILD_RESULT: ${{ steps.build.outcome }}
          TEST_SHARD: ${{ matrix.shard }}/6
        run: |
          {
            echo "Pull request head: $PR_HEAD"
            echo "Target: $BASE_REF at $BASE_SHA"
            echo "Tested merge commit: $GITHUB_SHA"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Install: $INSTALL_RESULT"
            echo "Typecheck: $TYPECHECK_RESULT"
            echo "Tests: $TEST_RESULT"
            echo "Build: $BUILD_RESULT"
            echo "Test shard: $TEST_SHARD"
            echo 'Runner limit: six GitHub-hosted jobs, 180 minutes per job.'
          } >> "$GITHUB_STEP_SUMMARY"

  release-tests:
    # Ignored labels must not publish a successful release-check identity.
    name: ${{ (github.event.action != 'labeled' || github.event.label.name == 'fork-release-tests') && 'Fork release checks' || 'Ignored label event' }}
    if: ${{ always() && (github.event.action != 'labeled' || github.event.label.name == 'fork-release-tests') }}
    needs: [test-shards]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every test shard to succeed
        env:
          SHARDS_RESULT: ${{ needs.test-shards.result }}
        run: |
          echo "Test shards: $SHARDS_RESULT" >> "$GITHUB_STEP_SUMMARY"
          test "$SHARDS_RESULT" = success
