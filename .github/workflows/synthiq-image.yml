# Synthiq thin-fork image build (fork-only; never proposed upstream).
# A push to a synthiq/<upstream-version> branch builds the upstream Dockerfile's production target on the
# operator's self-hosted runner and pushes registry.synthiq.ru/paperclip:<upstream-version>-synthiq.<run>.
# Push and manual triggers only: this fork is public, so no pull_request trigger may reach the self-hosted runner.
name: synthiq-image
on:
  push:
    branches: ["synthiq/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthiq-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'slayoffer/paperclip'
    runs-on: [self-hosted, paperclip-fork]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Same step as upstream's docker.yml: a release tag's lockfile can lag package metadata, and the Dockerfile
      # installs with --frozen-lockfile. Only pnpm-lock.yaml may change.
      - name: Refresh lockfile for Docker build context
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
          changed="$(git status --porcelain)"
          if [ -n "$changed" ] && printf '%s\n' "$changed" | grep -Fvq ' pnpm-lock.yaml'; then
            echo "Unexpected files changed during lockfile refresh:"; echo "$changed"; exit 1
          fi
      - name: Tag
        id: tag
        run: |
          base="${GITHUB_REF_NAME#synthiq/}"
          echo "version=${base}-synthiq.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "image=registry.synthiq.ru/paperclip:${base}-synthiq.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: |
          docker build --target production \
            --build-arg PAPERCLIP_BUILD_VERSION="${{ steps.tag.outputs.version }}" \
            --build-arg PAPERCLIP_BUILD_COMMIT="${GITHUB_SHA}" \
            --label org.opencontainers.image.source=https://github.com/slayoffer/paperclip \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.version="${{ steps.tag.outputs.version }}" \
            -t "${{ steps.tag.outputs.image }}" .
      - name: Push
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          export DOCKER_CONFIG="$(mktemp -d "${RUNNER_TEMP}/docker.XXXXXX")"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$REGISTRY_PASSWORD" | docker login registry.synthiq.ru -u "$REGISTRY_USER" --password-stdin
          docker push "${{ steps.tag.outputs.image }}"
          echo "pushed ${{ steps.tag.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
