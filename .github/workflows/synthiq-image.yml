# Synthiq thin-fork image build (fork-only; never proposed upstream).
# A push to a synthiq/<upstream-version> branch builds the upstream Dockerfile's production target on the
# operator's self-hosted runner and pushes registry.synthiq.ru/paperclip:<upstream-version>-synthiq.<run>.
# Push and manual triggers only: this fork is public, so no pull_request trigger may reach the self-hosted runner.
name: synthiq-image
on:
  push:
    branches: ["synthiq/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: synthiq-image-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'slayoffer/paperclip'
    runs-on: [self-hosted, paperclip-fork]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Same step as upstream's docker.yml: a release tag's lockfile can lag package metadata, and the Dockerfile
      # installs with --frozen-lockfile. Only pnpm-lock.yaml may change (exact path match).
      - name: Refresh lockfile for Docker build context
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --resolution-only --ignore-scripts --no-frozen-lockfile
          unexpected="$(git status --porcelain=v1 -z | tr '\0' '\n' | awk 'NF { p = substr($0, 4); if (p != "pnpm-lock.yaml") print }')"
          if [ -n "$unexpected" ]; then
            echo "Unexpected files changed during lockfile refresh:"; echo "$unexpected"; exit 1
          fi
      # Ref-derived values travel only through the environment and are validated; nothing is interpolated into shell source.
      - name: Tag
        id: tag
        env:
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          base="${REF_NAME#synthiq/}"
          if ! printf '%s' "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Branch must be synthiq/<upstream version>, got: $REF_NAME"; exit 1
          fi
          echo "version=${base}-synthiq.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "image=registry.synthiq.ru/paperclip:${base}-synthiq.${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          VERSION: ${{ steps.tag.outputs.version }}
          IMAGE: ${{ steps.tag.outputs.image }}
        run: |
          set -euo pipefail
          docker build --target production \
            --build-arg PAPERCLIP_BUILD_VERSION="$VERSION" \
            --build-arg PAPERCLIP_BUILD_COMMIT="$GITHUB_SHA" \
            --label org.opencontainers.image.source=https://github.com/slayoffer/paperclip \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$VERSION" \
            -t "$IMAGE" .
      - name: Push
        env:
          IMAGE: ${{ steps.tag.outputs.image }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d "${RUNNER_TEMP}/docker.XXXXXX")"
          [ -n "$tmp" ] && [ -d "$tmp" ] || { echo "mktemp failed"; exit 1; }
          export DOCKER_CONFIG="$tmp"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' "$REGISTRY_PASSWORD" | docker login registry.synthiq.ru -u "$REGISTRY_USER" --password-stdin
          # A push over the home uplink can hang with no progress (2026-10-16: one connection, ~0 bytes for an
          # hour). Bound each attempt and retry; layers that already arrived are skipped on the next attempt.
          for attempt in 1 2 3; do
            if timeout 1200 docker push "$IMAGE"; then break; fi
            [ "$attempt" = 3 ] && { echo "push failed after 3 attempts"; exit 1; }
            echo "push attempt $attempt failed or timed out; retrying"
          done
          echo "pushed $IMAGE" >> "$GITHUB_STEP_SUMMARY"
