# Fork-only flow report checks. Do not include this file in an upstream patch.
name: Synthiq company flow tests

on:
  pull_request:
    branches: ["synthiq/**"]
    paths:
      - ".github/workflows/synthiq-company-flow.yml"
      - "packages/shared/src/types/company-flow.ts"
      - "packages/db/src/**"
      - "server/src/routes/company-flow.ts"
      - "server/src/routes/dashboard.ts"
      - "server/src/routes/authz.ts"
      - "server/src/services/company-flow*.ts"
      - "server/src/services/agent-wip-limit.ts"
      - "server/src/services/issue-visibility.ts"
      - "server/src/__tests__/company-flow*.test.ts"
      - "ui/src/api/dashboard.ts"

permissions:
  contents: read

concurrency:
  group: synthiq-company-flow-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  company-flow:
    if: github.repository == 'slayoffer/paperclip'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Source: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # Source: https://github.com/actions/setup-node/releases/tag/v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Locate the package store
        id: store
        run: |
          corepack enable
          echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Source: https://github.com/actions/cache/releases/tag/v4.2.4
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.store.outputs.path }}
          key: synthiq-company-flow-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
      - name: Install dependencies
        # Release tags can have a lockfile that is older than package metadata.
        run: corepack pnpm install --no-frozen-lockfile
      - name: Build test dependencies
        run: |
          corepack pnpm --filter @paperclipai/paperclip-runner build:typescript
          corepack pnpm --filter @paperclipai/plugin-sdk build
      - name: Check shared types
        run: corepack pnpm --filter @paperclipai/shared typecheck
      - name: Check server types
        working-directory: server
        run: corepack pnpm exec tsc --noEmit
      - name: Test company flow, access, and route performance
        run: >-
          corepack pnpm exec vitest run --no-file-parallelism
          server/src/__tests__/company-flow-model.test.ts
          server/src/__tests__/company-flow.test.ts
          server/src/services/agent-wip-limit.test.ts
