# Fork-only interaction tests. Do not include this workflow in the upstream patch.
name: Synthiq interaction tests

on:
  pull_request:
    branches: ["synthiq/**"]
    paths:
      - ".github/workflows/synthiq-interactions.yml"
      - "packages/shared/src/**"
      - "server/src/routes/issues.ts"
      - "server/src/routes/*interaction*"
      - "server/src/routes/fork-read-api.ts"
      - "server/src/services/issue-thread-interactions*"
      - "server/src/__tests__/*interactions*"

permissions:
  contents: read

concurrency:
  group: synthiq-interactions-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  interactions:
    if: github.repository == 'slayoffer/paperclip'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"
      - name: Locate the package store
        id: store
        run: |
          corepack enable
          echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.store.outputs.path }}
          key: synthiq-interactions-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
      - name: Install dependencies
        # Release tags can have a lockfile that is older than package metadata.
        run: corepack pnpm install --no-frozen-lockfile
      - name: Build test dependencies
        run: |
          corepack pnpm --filter @paperclipai/paperclip-runner build:typescript
          corepack pnpm --filter @paperclipai/plugin-sdk build
      - name: Check shared types
        run: corepack pnpm --filter @paperclipai/shared typecheck
      - name: Check server types
        working-directory: server
        run: corepack pnpm exec tsc --noEmit
      - name: Test interaction reads
        run: >-
          corepack pnpm exec vitest run --no-file-parallelism --project @paperclipai/server
          server/src/__tests__/company-interactions-routes.test.ts
          server/src/__tests__/issue-interaction-reads.test.ts
          server/src/__tests__/company-interactions-openapi.test.ts
          server/src/__tests__/openapi-routes.test.ts
          server/src/__tests__/issue-interactions-read-only-contract.test.ts
          server/src/services/issue-thread-interactions.test.ts
