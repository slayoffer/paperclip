# Fork-only recovery checks. Do not include this workflow in an upstream patch.
name: Synthiq recovery bridge tests

on:
  pull_request:
    branches: ["synthiq/**"]
    paths:
      - .github/workflows/synthiq-recovery-bridge.yml
      - packages/adapter-utils/src/**
      - server/src/__tests__/issue-recovery*.test.ts
      - server/src/routes/issues.ts
      - server/src/services/issue-recovery-actions.ts
      - server/src/services/recovery/**
      - packages/db/src/**
      - packages/shared/src/**
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

concurrency:
  group: synthiq-recovery-bridge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  recovery-bridge:
    if: github.repository == 'slayoffer/paperclip'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Locate the package store
        id: store
        run: |
          corepack enable
          echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.store.outputs.path }}
          key: synthiq-recovery-bridge-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
      - name: Install dependencies
        # Release metadata requires an update to the inherited lockfile.
        run: corepack pnpm install --no-frozen-lockfile
      - name: Build test dependencies
        run: |
          corepack pnpm --filter @paperclipai/paperclip-runner build:typescript
          corepack pnpm --filter @paperclipai/plugin-sdk build
      - name: Check adapter types
        run: corepack pnpm --filter @paperclipai/adapter-utils typecheck
      - name: Check server types
        working-directory: server
        run: corepack pnpm exec tsc --noEmit
      - name: Test bridge policy and recovery authority
        run: >-
          corepack pnpm exec vitest run --no-file-parallelism
          packages/adapter-utils/src/sandbox-callback-bridge.test.ts
          packages/adapter-utils/src/sandbox-callback-bridge-recovery.test.ts
          server/src/__tests__/issue-recovery-actions.test.ts
          server/src/__tests__/issue-recovery-bridge.test.ts
