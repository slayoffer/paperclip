# Fork-only blocked-state checks. Do not include this file in an upstream patch.
name: Synthiq blocked-state tests

on:
  pull_request:
    branches: ["synthiq/**"]
    paths:
      - ".github/workflows/synthiq-blocked-state.yml"
      - "packages/shared/src/**"
      - "server/src/modules/run-dispatch/**"
      - "server/src/routes/issues.ts"
      - "server/src/routes/issue-dependency-wakeup.ts"
      - "server/src/services/**"
      - "server/src/__tests__/blocked-state-integrity.test.ts"
      - "server/src/__tests__/blocked-state-holds-and-stale-waits.test.ts"
      - "server/src/__tests__/dependency-release-wakes.test.ts"
      - "server/src/__tests__/dependency-release.test.ts"
      - "server/src/__tests__/issue-dependency-wakeup-release.test.ts"
      - "server/src/__tests__/issue-blocker*.test.ts"
      - "server/src/__tests__/issue-dependency-wakeups-routes.test.ts"
      - "server/src/__tests__/disposition-repair*.test.ts"

permissions:
  contents: read

concurrency:
  group: synthiq-blocked-state-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  blocked-state:
    if: github.repository == 'slayoffer/paperclip'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Source: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # Source: https://github.com/actions/setup-node/releases/tag/v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Locate the package store
        id: store
        run: |
          corepack enable
          echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Source: https://github.com/actions/cache/releases/tag/v4.2.4
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.store.outputs.path }}
          key: synthiq-blocked-state-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
      - name: Install dependencies
        # Release tags can have a lockfile that is older than package metadata.
        run: corepack pnpm install --no-frozen-lockfile
      - name: Build test dependencies
        run: |
          corepack pnpm --filter @paperclipai/paperclip-runner build:typescript
          corepack pnpm --filter @paperclipai/plugin-sdk build
      - name: Check shared types
        run: corepack pnpm --filter @paperclipai/shared typecheck
      - name: Check server types
        working-directory: server
        run: corepack pnpm exec tsc --noEmit
      - name: Test blocked states and dependency wakes
        run: >-
          corepack pnpm exec vitest run --no-file-parallelism
          packages/shared/src/validators/issue.test.ts
          server/src/__tests__/blocked-state-integrity.test.ts
          server/src/__tests__/blocked-state-holds-and-stale-waits.test.ts
          server/src/__tests__/dependency-release-wakes.test.ts
          server/src/__tests__/dependency-release.test.ts
          server/src/__tests__/issue-dependency-wakeup-release.test.ts
          server/src/__tests__/issue-blocker-attention.test.ts
          server/src/__tests__/issue-blocker-diagnostics-routes.test.ts
          server/src/__tests__/issue-dependency-wakeups-routes.test.ts
          server/src/__tests__/disposition-repair.test.ts
          server/src/__tests__/disposition-repair-documents.test.ts
          server/src/__tests__/issue-liveness.test.ts
          server/src/__tests__/recovery-classifiers.test.ts
          server/src/services/recovery/provider-failure-classification.test.ts
          server/src/services/self-block-guard.test.ts
          server/src/services/issue-dependency-wakeups.test.ts
