# Fork-only regression checks. Keep this workflow out of upstream patches.
name: Synthiq SSH sync tests

on:
  pull_request:
    branches: ["synthiq/**"]
    paths:
      - ".github/workflows/synthiq-ssh-sync.yml"
      - "packages/adapter-utils/**"
      - "packages/shared/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "vitest.config.ts"

permissions:
  contents: read

concurrency:
  group: synthiq-ssh-sync-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ssh-sync:
    if: github.repository == 'slayoffer/paperclip'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Verified 2026-10-20: https://github.com/actions/checkout/releases/tag/v4.3.1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      # Verified 2026-10-20: https://github.com/actions/setup-node/releases/tag/v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Locate the package store
        id: store
        run: |
          corepack enable
          echo "path=$(corepack pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      # Verified 2026-10-20: https://github.com/actions/cache/releases/tag/v4.2.4
      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.store.outputs.path }}
          key: synthiq-ssh-sync-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', '**/package.json') }}
      - name: Install dependencies
        # The upstream release lockfile can lag package metadata.
        run: corepack pnpm install --no-frozen-lockfile
      - name: Check adapter types
        run: corepack pnpm --filter @paperclipai/adapter-utils typecheck
      - name: Test workspace synchronization
        run: >-
          corepack pnpm exec vitest run --no-file-parallelism
          packages/adapter-utils/src/ssh-download.test.ts
          packages/adapter-utils/src/ssh-sync-regressions.test.ts
          packages/adapter-utils/src/ssh-fixture.test.ts
          packages/adapter-utils/src/remote-managed-runtime.test.ts
          packages/adapter-utils/src/workspace-restore-merge.test.ts
